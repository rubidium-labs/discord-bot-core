# Copy of rubidium-labs/workflows templates/project.yml, adapted for this library.
# Pull requests: CI. Push to main (a merged PR): CI, then the dev deploy.
# Release tag v1.2.3 (signed by Tim): CI, then the prod deploy.
# The reusable ci.yml takes a single command, so the extra checks (ruff, mypy) are
# explicit steps here, after the reusable job.
name: main
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: rubidium-labs/workflows/.github/workflows/ci.yml@main
    with:
      python-version: "3.14"
      command: uv run pytest

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # no major tag published
        with:
          python-version: "3.14"
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy src

  deploy-dev:
    needs: ci
    if: github.ref == 'refs/heads/main'
    uses: rubidium-labs/workflows/.github/workflows/deploy-dev.yml@main

  deploy-prod:
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    uses: rubidium-labs/workflows/.github/workflows/deploy-prod.yml@main
