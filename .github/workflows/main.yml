# CI-only workflow for this library: a library has no compose.dev.yml /
# compose.prod.yml, so there is nothing to deploy in dev or prod.
# Pull requests and pushes to main: CI (tests, ruff, mypy).
# Release tags (v*, signed by Tim) trigger nothing here; apps pin the tag as a
# git dependency instead.
# The reusable ci.yml takes a single command, so the extra checks (ruff, mypy) are
# explicit steps here, after the reusable job.
name: main
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # no major tag published
        with:
          python-version: "3.14"
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy src
